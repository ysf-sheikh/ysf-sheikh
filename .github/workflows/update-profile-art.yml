name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  contribution-city:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: |
          python scripts/fetch_contributions.py

      - name: Render animated contribution city
        run: |
          python scripts/render_city_gif.py

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution city [skip ci]"
          file_pattern: "data/contributions.json contribution-city.gif"
